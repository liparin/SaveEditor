name: Build SaveEditor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"

      - name: Build Project
        shell: pwsh
        run: |
          $lazDir = Split-Path (Get-Command lazbuild).Source -Parent
          $fpcCfg = Join-Path $lazDir "fpc\3.2.2\bin\x86_64-win64\fpc.cfg"
          
          $lclBase = Join-Path $lazDir "lcl\units\x86_64-win64"
          $lclWin32 = Join-Path $lclBase "win32"
          
          Write-Host "Lazarus dir: $lazDir"
          Write-Host "LCL base: $lclBase"
          Write-Host "LCL win32: $lclWin32"
          
          # Проверяем, что Interfaces.ppu существует
          $interfacesFile = Join-Path $lclWin32 "Interfaces.ppu"
          if (Test-Path $interfacesFile) {
            Write-Host "Found: $interfacesFile"
          } else {
            Write-Host "WARNING: Interfaces.ppu not found at $interfacesFile"
            # Ищем файл по всей папке Lazarus
            Get-ChildItem -Path $lazDir -Recurse -Filter "Interfaces.ppu" | ForEach-Object { Write-Host "Found at: $($_.FullName)" }
          }
          
          # Добавляем пути к LCL-юнитам прямо в fpc.cfg
          Add-Content -Path $fpcCfg -Value "-Fu$lclBase"
          Add-Content -Path $fpcCfg -Value "-Fu$lclWin32"
          
          # Собираем проект
          lazbuild -B SaveEditor.lpi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-Windows
          path: SaveEditor.exe
