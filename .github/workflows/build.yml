name: Build SaveEditor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Забираем твой код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ставим Lazarus (автоматически, без choco, без ручных путей)
      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"

      # 3. Компилируем проект. setup-lazarus уже добавил lazbuild в PATH
      - name: Build Project
        run: lazbuild -B SaveEditor.lpi

      # 4. Сохраняем результат как артефакт (чтобы ты мог скачать .exe)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-Windows
          path: SaveEditor.exe
