name: Build SaveEditor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        id: setup-lazarus
        with:
          lazarus-version: "stable"

      - name: Build Project
        shell: pwsh
        run: |
          $fpcPath = "${{ steps.setup-lazarus.outputs.fpc-path }}"
          $lazPath = "${{ steps.setup-lazarus.outputs.lazarus-path }}"
          
          $fpcUnits = "$fpcPath\units\win64-x64"
          $lazUnits = "$lazPath\lcl\units\win64-x64"
          
          Write-Host "FPC Units: \$fpcUnits"
          Write-Host "LCL Units: \$lazUnits"
          
          lazbuild -B -Fu"$fpcUnits" -Fu"$lazUnits" SaveEditor.lpi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-Windows
          path: SaveEditor.exe

