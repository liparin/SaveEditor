name: Build SaveEditor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "stable"

      - name: Build Project
        shell: pwsh
        run: |
          $lazbuildExe = (Get-Command lazbuild).Source
          $lazDir = Split-Path $lazbuildExe -Parent
          $fpcExe = Join-Path $lazDir "fpc\3.2.2\bin\x86_64-win64\fpc.exe"
          
          $cfgDir = Join-Path $env:RUNNER_TEMP "laz-cfg"
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
          
          $xml = '<CONFIG><EnvironmentOptions><LazarusDirectory Value="' + $lazDir + '"/><CompilerFilename Value="' + $fpcExe + '"/></EnvironmentOptions></CONFIG>'
          Set-Content -Path (Join-Path $cfgDir "environmentoptions.xml") -Value $xml -Encoding UTF8
          
          & $lazbuildExe --pcp="$cfgDir" --lazarusdir="$lazDir" -B SaveEditor.lpi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveEditor-Windows
          path: SaveEditor.exe
